<title>Manhwageo — მანჰვა ქართულად</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#17161e;--panel:#222;--text:#eee;--muted:#b0adb2;--line:#36343d;--btn:#333;--accent:#ffcb27}
body.light{color-scheme:light;--bg:#e9e8ec;--panel:#fff;--text:#222;--muted:#62606a;--line:#ddd;--btn:#eeedf1}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "DejaVu Sans",Arial,sans-serif}
header,footer{background:#080808;color:white}
header>div,main,nav,footer>div{max-width:1000px;margin:auto}
header>div{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}
button,select{cursor:pointer;color:inherit;background:var(--btn);border:0;border-radius:3px;padding:6px 10px}
header button{background:none;color:white;min-width:38px;padding:4px;font-size:23px}
.logo{font:bold condensed 24px Georgia,serif;font-family:Georgia,serif;font-weight:900;font-size:24px;letter-spacing:-1.2px;margin-right:auto}
#theme{font-size:10px;line-height:1.1;color:#ddd}#theme span{display:block;background:#444;border-radius:10px;margin-top:3px;font-size:12px}
nav{padding:12px 18px}nav a{margin-right:18px}main{padding-top:30px}
section{margin-bottom:8px;background:var(--panel)}h2,h3,p{margin:0}h2,.bar{font-size:16px;padding:10px 14px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;font-weight:bold}.bar a,.black,.tabs [aria-pressed=true],.pages [aria-current=page]{background:#080808;color:white;border-radius:3px;padding:4px 8px}.bar a{font-size:11px}
.shelfhead{background:#080808;padding:12px 12px 0}.shelfhead h2{display:inline-block;background:var(--panel);border:0;border-radius:5px 5px 0 0;padding:6px 16px}
.rail,.grid{display:grid;gap:16px;padding:18px}.rail{grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:25px;scrollbar-color:#555 #151515}.card{min-width:0;scroll-snap-align:center}.card strong{display:block;margin:6px 0 3px;line-height:1.35;overflow-wrap:anywhere}.cover{width:100%;aspect-ratio:0.73;object-fit:cover;display:block}
.card small,.muted,time{color:var(--muted)}.stars{color:var(--accent);font-size:15px;letter-spacing:-1px}.score{color:var(--muted);font-size:11px;margin-left:4px}
.update{display:grid;grid-template-columns:28% 1fr;gap:10px;margin:0 10px;padding:14px 8px;border-bottom:1px solid var(--line)}.update h3{font-size:15px}.chapters{list-style:none;margin:6px 0;padding:0}.chapters li a{display:flex;align-items:center;gap:5px;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:13px}.chapters time{font-size:11px}.status{display:inline-block;color:var(--muted);font-size:11px;background:var(--btn);padding:3px 7px;border-radius:4px}.status:before{content:"●";color:#ec990e;margin-right:5px}
.tabs,.pages{display:flex;gap:4px;margin:12px}.tabs{background:var(--btn);padding:4px;border-radius:4px}.tabs button{flex:1}.pages{justify-content:center;padding-bottom:16px;margin-bottom:0}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.rank{display:grid;grid-template-columns:25px 55px 1fr;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line)}.rank b{color:var(--muted);border:1px solid var(--line);text-align:center;border-radius:3px}.genres,.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}.filters>*{min-width:0}.filters input,.filters button{grid-column:1/-1;padding:8px}.filters input{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:3px}.tools{text-align:right;padding:0 14px}.list{display:grid;gap:0;padding:12px}.list .card{padding:8px;border-bottom:1px solid var(--line)}.list .cover{display:none}.empty,footer>div{padding:22px 15px}.up{position:fixed;bottom:15px;right:15px;border-radius:50%;background:#080808;color:white;width:40px;height:40px}
dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);width:min(90%,460px);border-radius:7px}dialog::backdrop{background:#000b}dialog button{float:right}dialog h2{padding:4px 0 10px}
@media(min-width:700px){.rail{grid-auto-columns:155px}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.update{grid-template-columns:100px 1fr}.update h3{font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:12px}.layout>*{min-width:0}.recommend{grid-template-columns:repeat(3,1fr)}}
.lens{display:inline-block;width:16px;height:16px;border:2px solid;border-radius:50%;position:relative}.lens:after{content:"";position:absolute;background:currentColor;width:8px;height:2px;right:-6px;bottom:-3px;transform:rotate(45deg)}

const $ = id => document.getElementById(id);
const genres=[...new Set(books.map(book=>book.genre))];
const rankings=[[0,2,1,4,3,5],[1,4,2,0,5,3],[4,0,1,5,2,3]];
let page=0, genreTab=genres[0], period=0, textMode=false;
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function art(i){return '<img class="cover" alt="" src="'+covers[i % covers.length]+'">'}
function score(i){return '<span class="stars">★★★★☆</span><span class="score">'+books[i].score.toFixed(1)+'</span>'}
function card(i){const b=books[i];return '<a class="card" href="#book/'+i+'">'+art(i)+'<strong>'+escapeText(b.title)+'</strong><small>თავი '+b.chapter+'</small><div>'+score(i)+'</div></a>'}
function chapters(i){const b=books[i];return '<ul class="chapters">'+[0,1,2].filter(d=>b.chapter>d).map((d)=>'<li><a href="#book/'+i+'/'+(b.chapter-d)+'"><span>• თავი '+(b.chapter-d)+'</span><time>'+['დღეს','1 კვირის წინ','2 კვირის წინ'][d]+'</time></a></li>').join('')+'</ul>'}
function row(i){const b=books[i];return '<article class="update"><a aria-label="'+escapeText(b.title)+'" href="#book/'+i+'">'+art(i)+'</a><div><h3><a href="#book/'+i+'">'+escapeText(b.title)+'</a></h3>'+chapters(i)+'<span class="status">'+b.status+'</span></div></article>'}
function tabs(items,active,key){return '<div class="tabs">'+items.map((item,i)=>'<button data-'+key+'="'+i+'" aria-pressed="'+(i===active)+'">'+item+'</button>').join('')+'</div>'}
function refreshHome(){
 $('updates').innerHTML=books.slice(page*3,page*3+3).map((_,i)=>row(page*3+i)).join('');
 $('pages').innerHTML=[0,1].map(i=>'<button data-page="'+i+'" aria-current="'+(i===page?'page':'false')+'">'+(i+1)+'</button>').join('');
 $('suggest').innerHTML=tabs(genres,genres.indexOf(genreTab),'genre')+'<div class="grid recommend">'+books.map((b,i)=>b.genre===genreTab?card(i):'').join('')+'</div>';
 $('ranking').innerHTML=tabs(['კვირა','თვე','სულ'],period,'period')+rankings[period].map((i,pos)=>'<a class="rank" href="#book/'+i+'"><b>'+(pos+1)+'</b>'+art(i)+'<div><strong>'+escapeText(books[i].title)+'</strong><div>'+score(i)+'</div></div></a>').join('');
}
function home(){
 $('main').innerHTML='<section><div class="shelfhead"><h2>დღეს პოპულარულია</h2></div><div class="rail">'+books.map((_,i)=>card(i)).join('')+'</div></section><div class="layout"><div><section><div class="bar">ბოლო განახლებები<a href="#catalog">ყველა</a></div><div id="updates"></div><div class="pages" id="pages"></div></section><section><h2>რეკომენდაციები</h2><div id="suggest"></div></section></div><aside><section><h2>პოპულარული</h2><div id="ranking"></div></section><section id="genres"><h2>ჟანრები</h2><div class="genres">'+genres.map((g,i)=>'<a href="#catalog/'+i+'">'+g+'</a>').join('')+'</div></section></aside></div>';
 refreshHome();
}
function dropdown(id,label,values){return '<select id="'+id+'" aria-label="'+label+'"><option value="">'+label+'</option>'+values.map(v=>'<option>'+v+'</option>').join('')+'</select>'}
function catalog(id){
 $('main').innerHTML='<section><h2>კატალოგი</h2><form class="filters" id="filters"><input aria-label="სათაური" placeholder="მოძებნე სათაურით…" id="query" type="search">'+dropdown('genre','ყველა ჟანრი',genres)+dropdown('status','ყველა სტატუსი',[...new Set(books.map(b=>b.status))])+dropdown('type','ყველა ტიპი',[...new Set(books.map(b=>b.type))])+dropdown('order','განახლებით',['ა–ჰ','ჰ–ა','რეიტინგით'])+'<button class="black">ძებნა</button></form><div class="tools"><button id="mode"></button></div><div id="results"></div></section>';
 $('genre').value=genres[id]||''; $('filters').onsubmit=e=>{e.preventDefault();results()}; $('filters').oninput=results;
 $('mode').onclick=()=>{textMode=!textMode;results()};results();
}
function results(){
 const q=$('query').value.trim().toLocaleLowerCase();
 const ids=books.map((_,i)=>i).filter(i=>books[i].title.toLocaleLowerCase().includes(q)&&['genre','status','type'].every(k=>!$(k).value||books[i][k]===$(k).value));
 const sort=$('order').value;
 if(sort==='რეიტინგით')ids.sort((a,b)=>books[b].score-books[a].score);
 else if(sort)ids.sort((a,b)=>books[a].title.localeCompare(books[b].title,'ka')*(sort==='ა–ჰ'?1:-1));
 $('results').className=textMode?'list':'grid';$('mode').textContent=textMode?'ყდებით ჩვენება':'ტექსტური სია';
 $('results').innerHTML=ids.length?ids.map(card).join(''):'<p class="empty">ვერაფერი მოიძებნა.</p>';
}
let backgroundRoute='';
function route(){
 const [view,arg,num]=location.hash.slice(1).split('/');
 $('nav').hidden=true;$('menu').setAttribute('aria-expanded','false');
 if(view==='book' && /^\d+$/.test(arg) && books[arg]){
   if(!$('main').children.length)home();
   const b=books[arg];const n=Number(num);
   $('info').innerHTML='<h2>'+escapeText(b.title)+'</h2><p class="muted">'+b.type+' · '+b.genre+'</p>'+(n?'<h3>თავი '+n+'</h3><p>ამ საცდელ თავში გვერდები ჯერ არ ატვირთულა.</p>':chapters(Number(arg)));
   if(n && b.links?.[n])location.assign(b.links[n]);
   else if(!$('details').open)$('details').showModal();
   return;
 }
 if($('details').open)$('details').close();
 backgroundRoute=location.hash;
 if(view==='catalog')catalog(arg);else home();
 if(view==='genres')$('genres').scrollIntoView();else window.scrollTo(0,0);
}
$('close').onclick=()=>location.hash=backgroundRoute||'#home';
$('details').oncancel=e=>{e.preventDefault();$('close').click()};
$('menu').onclick=()=>{const nav=$('nav');nav.hidden=!nav.hidden;$('menu').setAttribute('aria-expanded',String(!nav.hidden))};
$('search').onclick=()=>{if(location.hash!=='#catalog')location.hash='catalog';setTimeout(()=>$('query')?.focus(),50)};
function setLight(light){document.body.classList.toggle('light',light);$('theme').querySelector('span').textContent=light?'☀':'☾'}
try{setLight(localStorage.manhwaTheme==='light')}catch{}
$('theme').onclick=()=>{setLight(!document.body.classList.contains('light'));try{localStorage.manhwaTheme=document.body.classList.contains('light')?'light':'dark'}catch{}};
$('main').onclick=e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.page!==undefined){page=Number(button.dataset.page);refreshHome();$('updates').scrollIntoView()}
 if(button.dataset.genre!==undefined){genreTab=genres[Number(button.dataset.genre)];refreshHome()}
 if(button.dataset.period!==undefined){period=Number(button.dataset.period);refreshHome()}
};
$('up').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>$('up').hidden=scrollY<400);
addEventListener('hashchange',route);route();
</script></body></html>
